id: markdown-list-nesting
problem_statement: |
  `mdlist` turns an indented markdown list into a tree. Two bugs across the two modules: `tokenize` counts a tab as a single column, so tab-indented items do not line up with space-indented ones (a tab should advance to the next 4-column tab stop); and `build_tree` pops only one level off its stack, so an item that dedents by more than one level is attached to the wrong parent instead of returning to the right one. Fix both.
dev_test_cmd: python -m pytest -q test_basic.py
eval_test_cmd: python -m pytest -q
timeout: 120
multi_file: true
has_gold_patch: true
