id: url-query-multivalue
problem_statement: |
  `urlkit.encode` builds query strings that `urlkit.parse` reads back. Two bugs in the encoder: reserved characters are emitted raw, so a value containing `&` or `=` corrupts the query it sits in; and a list value is stringified whole instead of producing one repeated key per element. Fix `quote` to percent-encode anything outside the unreserved set as UTF-8 (space stays `+`), and `build_query` to emit `tag=a&tag=b` for a list.
dev_test_cmd: python -m pytest -q test_basic.py
eval_test_cmd: python -m pytest -q
timeout: 120
multi_file: true
has_gold_patch: true
