[project]
name = "agenteval"
version = "0.1.0"
description = "A benchmark-agnostic evaluation harness for LLM coding agents: measures solve rate, logs structured failure modes, and runs controlled ablations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",      # OpenAI-compatible client (points at local Ollama or any API)
    "rich>=13.7",        # readable trajectory + run logging
    "pyyaml>=6.0",       # experiment configs
    "jinja2>=3.1",       # HTML dashboard rendering
]

[project.optional-dependencies]
# Heavy deps only needed to run the real SWE-bench benchmark (Docker-based eval).
swebench = [
    "datasets>=2.19",
    "swebench>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
agenteval = "agenteval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval"]

[tool.ruff]
line-length = 100
